[project]
name = "como"
version = "0.8.0"
description = "Track battery health over time from the command line."
authors = [{ name = "cwoebker" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "python-crontab>=3.0; sys_platform == 'linux'",
]

[project.scripts]
como = "como.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "ty>=0.0.1a6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=como --cov-report=term-missing --cov-branch"

[tool.coverage.run]
source = ["como"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["como"]

[tool.ty.environment]
python-version = "3.10"
